services:
  postgres:
    image: postgres:18
    container_name: clubhub-postgres
    environment:
      POSTGRES_DB: clubhub
      POSTGRES_USER: clubhub
      POSTGRES_PASSWORD: clubhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PG 18 image: mount the parent dir, NOT .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubhub -d clubhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # single-node KRaft broker (no ZooKeeper); the image's defaults listen on localhost:9092
    image: apache/kafka:4.1.0
    container_name: clubhub-kafka
    ports:
      - "9092:9092"

  redis:
    image: redis:8
    container_name: clubhub-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
