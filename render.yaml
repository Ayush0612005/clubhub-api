# Render Blueprint: the ClubHub API on Render's FREE web service (no card needed).
# Render dashboard → New → Blueprint → pick this repo. Values marked sync:false are asked for
# once in the dashboard (see docs/DEPLOY.md for where each one comes from).
services:
  - type: web
    name: clubhub-api
    runtime: docker
    plan: free
    region: singapore             # closest free region to Chennai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      # 512 MB instance: modest heap, serial GC, small thread stacks and code cache
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=48m
          -XX:MaxMetaspaceSize=160m -XX:TieredStopAtLevel=1 -Duser.timezone=UTC
      - key: JWT_SECRET
        generateValue: true
      - key: CLUBHUB_DEFAULT_PLAN
        value: PRO
      # API calls arrive through Vercel's proxy, so many users can share an egress IP
      - key: CLUBHUB_AUTH_RATE_LIMIT
        value: "120"
      - key: CLUBHUB_APP_URL
        sync: false               # https://<your-project>.vercel.app
      - key: CLUBHUB_ALLOWED_ORIGINS
        sync: false               # https://<your-project>.vercel.app,https://<your-project>-*.vercel.app
      - key: CLUBHUB_ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false               # Neon, direct endpoint: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false               # Upstash: rediss://default:<password>@<host>:6379
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false               # Aiven: <service>.aivencloud.com:<port>
      - key: KAFKA_ACCESS_KEY
        sync: false               # Aiven: contents of service.key
      - key: KAFKA_ACCESS_CERT
        sync: false               # Aiven: contents of service.cert
      - key: KAFKA_CA_CERT
        sync: false               # Aiven: contents of ca.pem
