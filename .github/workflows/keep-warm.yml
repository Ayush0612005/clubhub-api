name: Keep API warm

# Render's free tier spins the API down after 15 idle minutes, and a cold boot takes ~100 s.
# Pinging every 10 minutes keeps one instance up (free plan: 750 instance-hours a month,
# enough for a single always-on service). Public repos get unlimited Actions minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (waits through a cold start)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://clubhub-api-9sw2.onrender.com/actuator/health || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "API did not answer 200"; exit 1
