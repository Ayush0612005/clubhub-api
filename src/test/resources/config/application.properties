# Test-only overrides (Spring Boot reads classpath:/config/ on top of application.yaml).
# Clubs created by tests start on PRO so feature tests aren't blocked by FREE limits;
# PlanTest switches its own club to FREE to test the limits themselves.
clubhub.plans.default-plan=PRO
# Many test classes log in from 127.0.0.1 within one minute; RateLimitTest lowers this itself.
clubhub.rate-limits.auth-per-minute=10000
