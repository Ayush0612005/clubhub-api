# Profile "cloud": free managed services (Render + Neon + Upstash), enabled with
# SPRING_PROFILES_ACTIVE=cloud. Every secret comes from an environment variable; see docs/DEPLOY.md.
# Domain events are delivered in-process (no broker). With a hosted Kafka available, also activate
# the "cloud-kafka" profile: SPRING_PROFILES_ACTIVE=cloud,cloud-kafka

server:
  port: ${PORT:8080}              # Render injects PORT
  forward-headers-strategy: native # real client IP from the platform's proxy (per-IP login rate limit)
  tomcat:
    threads:
      max: 40                     # small instance: fewer threads, less stack memory

spring:
  autoconfigure:
    # no broker on the free tier: don't create Kafka clients at all
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration
  datasource:
    # Neon: use the DIRECT endpoint (not "-pooler"): tenants switch search_path per connection,
    # which a transaction-mode pooler would leak between clients. ?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5        # free Postgres tiers allow few connections
      minimum-idle: 1
  data:
    redis:
      url: ${REDIS_URL}           # Upstash: rediss://default:<password>@<host>:6379 (TLS)

clubhub:
  events:
    transport: in-process         # see InProcessEventRelay; "kafka" in the cloud-kafka profile

management:
  endpoints:
    web:
      exposure:
        include: health,info      # no separate private port on Render: keep metrics closed
