spring:
  application:
    name: clubhub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/clubhub
    username: clubhub
    password: clubhub
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns every schema. "validate" can't be used: Hibernate would check tenant
      # tables (club_profile...) against "public", where they deliberately don't exist.
      # Entity/table mismatches are caught by the Testcontainers integration tests instead.
      ddl-auto: none
  flyway:
    schemas: public
    locations: classpath:db/migration/public
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        # fail fast instead of blocking a request thread for 60 s when the broker is down
        max.block.ms: 5000

clubhub:
  web:
    # browser origins allowed to open the /ws WebSocket (the React dev server by default)
    allowed-origins: ${CLUBHUB_ALLOWED_ORIGINS:http://localhost:5173}
    # frontend base URL used for links inside emails
    app-url: ${CLUBHUB_APP_URL:http://localhost:5173}
  mail:
    # "log" (default: nothing is sent, only logged) or "ses" (Amazon SES, production)
    provider: ${CLUBHUB_MAIL_PROVIDER:log}
    from: ${CLUBHUB_MAIL_FROM:ClubHub <no-reply@clubhub.local>}
  # Absolute base URL printed on certificates (verification link + QR). Production: https://api.<domain>
  public-base-url: ${CLUBHUB_PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    bucket: ${CLUBHUB_S3_BUCKET:clubhub-dev}
    region: ${AWS_REGION:ap-south-1}
    # only for S3-compatible emulators (e.g. http://localhost:4566); empty = real AWS S3
    endpoint: ${CLUBHUB_S3_ENDPOINT:}
    # empty = AWS default credential chain (env vars locally, instance role on EC2)
    access-key: ${CLUBHUB_S3_ACCESS_KEY:}
    secret-key: ${CLUBHUB_S3_SECRET_KEY:}
    upload-url-ttl: 10m
    download-url-ttl: 5m
    max-upload-bytes: 5242880 # 5 MB
  jwt:
    # HS256 key, >= 32 bytes. The default is for local dev/tests ONLY; production sets JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
    issuer: clubhub-api
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  bootstrap:
    # Existing account to promote to PLATFORM_ADMIN at startup (empty = do nothing)
    platform-admin-email: ${CLUBHUB_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
