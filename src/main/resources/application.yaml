spring:
  application:
    name: clubhub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/clubhub
    username: clubhub
    password: clubhub
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns every schema. "validate" can't be used: Hibernate would check tenant
      # tables (club_profile...) against "public", where they deliberately don't exist.
      # Entity/table mismatches are caught by the Testcontainers integration tests instead.
      ddl-auto: none
  flyway:
    schemas: public
    locations: classpath:db/migration/public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis only holds rate-limit buckets; all repositories are JPA
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        # fail fast instead of blocking a request thread for 60 s when the broker is down
        max.block.ms: 5000

clubhub:
  web:
    # browser origins allowed to open the /ws WebSocket (the React dev server by default)
    allowed-origins: ${CLUBHUB_ALLOWED_ORIGINS:http://localhost:5173}
    # frontend base URL used for links in emails and the certificate verification QR
    app-url: ${CLUBHUB_APP_URL:http://localhost:5173}
  plans:
    # plan given to newly created clubs (FREE or PRO)
    default-plan: ${CLUBHUB_DEFAULT_PLAN:FREE}
  rate-limits:
    # per client IP on login/register/refresh
    auth-per-minute: ${CLUBHUB_AUTH_RATE_LIMIT:20}
    # per club requests come from its plan (FREE 300/min, PRO 3000/min); >0 here overrides for all clubs
    club-per-minute-override: 0
  mail:
    # "log" (default: nothing is sent, only logged) or "ses" (Amazon SES, production)
    provider: ${CLUBHUB_MAIL_PROVIDER:log}
    from: ${CLUBHUB_MAIL_FROM:ClubHub <no-reply@clubhub.local>}
  storage:
    bucket: ${CLUBHUB_S3_BUCKET:clubhub-dev}
    region: ${AWS_REGION:ap-south-1}
    # only for S3-compatible emulators (e.g. http://localhost:4566); empty = real AWS S3
    endpoint: ${CLUBHUB_S3_ENDPOINT:}
    # empty = AWS default credential chain (env vars locally, instance role on EC2)
    access-key: ${CLUBHUB_S3_ACCESS_KEY:}
    secret-key: ${CLUBHUB_S3_SECRET_KEY:}
    upload-url-ttl: 10m
    download-url-ttl: 5m
    max-upload-bytes: 5242880 # 5 MB
  jwt:
    # HS256 key, >= 32 bytes. The default is for local dev/tests ONLY; production sets JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
    issuer: clubhub-api
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  bootstrap:
    # Existing account to promote to PLATFORM_ADMIN at startup (empty = do nothing)
    platform-admin-email: ${CLUBHUB_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        # prometheus is unauthenticated: the reverse proxy never routes /actuator, only the
        # private Docker network (Prometheus) can reach it
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness for container health checks
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # histogram buckets so Grafana can compute p95/p99 latency per endpoint
      percentiles-histogram:
        http.server.requests: true
